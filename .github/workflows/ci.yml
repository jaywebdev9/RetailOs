name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci || npm install
      - name: Generate Prisma client
        run: npx prisma generate --schema=./prisma/schema.prisma
      - name: Build API
        run: npm run build -w @retail-os/api
        env:
          JWT_ACCESS_SECRET: ci-test-secret-min-32-characters-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
      - name: Build Web
        run: npm run build -w @retail-os/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail_ci
          POSTGRES_DB: retail_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retail:retail_ci@localhost:5432/retail_os_test?schema=public
      JWT_ACCESS_SECRET: ci-test-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci || npm install
      - name: Sync test database schema
        run: npx prisma db push --schema=./prisma/schema.prisma

      - name: Generate client
        run: npx prisma generate --schema=./prisma/schema.prisma
      - name: E2E critical flow
        run: npm run test:e2e -w @retail-os/api
